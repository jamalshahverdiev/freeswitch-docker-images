name: Build & push FreeSWITCH images

on:
  schedule:
    - cron: '0 3 * * *'        # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the tag already exists on Docker Hub'
        type: boolean
        default: false

concurrency:
  group: freeswitch-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan builds
        id: plan
        env:
          SIGNALWIRE_TOKEN: ${{ secrets.SIGNALWIRE_TOKEN }}
          DOCKERHUB_REPO: jamalshahverdiev/freeswitch
          FORCE: ${{ inputs.force }}
        run: |
          chmod +x scripts/plan-builds.sh
          ./scripts/plan-builds.sh

  build:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write SignalWire token for build secret
        run: printf '%s' "${{ secrets.SIGNALWIRE_TOKEN }}" > token.txt

      - name: Build & push ${{ matrix.codename }} / ${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            FS_REPO_PATH=${{ matrix.repo_path }}
            FS_PACKAGE=${{ matrix.package }}
            FS_VERSION=${{ matrix.version }}
          secret-files: |
            signalwire_token=token.txt
          tags: ${{ matrix.tags }}

      - name: Clean up token
        if: always()
        run: rm -f token.txt
